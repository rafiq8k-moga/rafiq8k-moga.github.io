<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>AI bikin AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #0d0d0d;
      color: #00ff9c;
      overflow-x: hidden;
    }
    .line {
      white-space: nowrap;
      font-size: 18px;
      padding: 2px 10px;
    }
  </style>
</head>
<body>

<script>
  const text = "AI bikin AI, lalu ";
  let container = document.body;

  function addLine() {
    const div = document.createElement("div");
    div.className = "line";

    // bikin teks panjang tak berujung
    let content = "";
    const repeat = Math.ceil(window.innerWidth / 120);
    for (let i = 0; i < repeat; i++) {
      content += text;
    }
    content += "AI bikin AI";

    div.textContent = content;
    container.appendChild(div);

    // jaga biar ga makan RAM brutal
    if (container.children.length > 1000) {
      container.removeChild(container.firstChild);
    }
  }

  // initial fill
  for (let i = 0; i < 30; i++) addLine();

  window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
      for (let i = 0; i < 10; i++) addLine();
    }
  });
</script>

</body>
</html>
